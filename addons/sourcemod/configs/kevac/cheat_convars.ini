"mat_normalmaps"             "0"
"mat_showmiplevels"          "0"
"r_drawrenderboxes"          "0"
"r_visualizetraces"          "0"
"vcollide_wireframe"         "0"
"r_drawlights"               "0"
"r_showenvcubemap"           "0"

// --- Radar / overview map hack ---
"cl_leveloverview"           "0"
