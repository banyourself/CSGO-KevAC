// KevAC extended cheat-cvar probe.
// Every entry is an FCVAR_CHEAT client cvar and its enforced default value. A client that
// reports a different value while the server has sv_cheats 0 has patched cvar protection
// (a basic/lazy DLL) - zero false positives, because a legit client physically cannot change
// an FCVAR_CHEAT cvar with sv_cheats 0. Admins (kevac_admin_immune 1) and whitelisted SteamIDs
// are skipped. Format: "cvar" "required_value". Add more from convarschecker/cheating_convars_disabled.ini.

// --- Wallhack / chams / model ESP ---
"r_drawothermodels"          "1"
"mat_fullbright"             "0"
"mat_wireframe"              "0"
"mat_hsv"                    "0"
"mat_yuv"                    "0"
"r_drawmodelstatsoverlay"    "0"
"enable_skeleton_draw"       "0"

// --- Smoke / particle / fog removal (visibility) ---
"r_drawparticles"            "1"
"fog_override"               "0"
"mat_showlowresimage"        "0"

// --- Tracers / spread / recoil visual aids ---
"r_drawtracers"              "1"
"weapon_debug_spread_show"   "0"
"cl_crosshair_recoil"        "0"
"glow_outline_effect_enable" "1"

// --- Anti-aim / view manipulation ---
"cl_pitchdown"               "89"
"cl_pitchup"                 "89"

// --- Timescale / netcode abuse ---
"host_timescale"             "1.0"
"net_earliertempents"        "0"

// --- World / PVS removal wallhacks ---
"r_drawworld"                "1"
"r_novis"                    "0"
"r_lockpvs"                  "0"
"r_portalsopenall"           "0"

// --- Model / material ESP + chams ---
